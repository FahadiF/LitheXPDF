<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Variant C: "Added" icon style but with a neon-red badge containing "LitheXPDF".
    The badge sits at the bottom-right, overlapping the document edge slightly.
    Lightning bolt is bold and centered. Transparent background.
  -->

  <!-- Document body: white fill, neon-red thick stroke -->
  <path
    d="M112 28h190l98 98v310H112z"
    fill="#fff"
    stroke="#ff1e56"
    stroke-linejoin="round"
    stroke-width="16"
  />

  <!-- Folded corner flap -->
  <path
    d="M302 28v98h98"
    fill="none"
    stroke="#ff1e56"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="16"
  />

  <!-- Lightning bolt -->
  <path
    d="m298 120-117 164h82l-55 137 157-199h-88l62-102z"
    fill="#ff1e56"
  />

  <!-- LitheXPDF pill badge overlapping bottom edge -->
  <g transform="translate(96, 444)">
    <rect width="320" height="52" rx="26" fill="#ff1e56"/>
    <text
      x="160" y="35"
      font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="24"
      fill="#ffffff"
      text-anchor="middle"
      letter-spacing="3"
    >LitheXPDF</text>
  </g>
</svg>
