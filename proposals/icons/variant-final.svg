<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Document paper gradient -->
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Fold gradient -->
    <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Main lightning gradient -->
    <linearGradient id="lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="35%" stop-color="#ff0844"/>
      <stop offset="70%" stop-color="#ff1e56"/>
      <stop offset="100%" stop-color="#d60036"/>
    </linearGradient>

    <!-- Lightning inner core gradient -->
    <linearGradient id="lightning-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fff0f3"/>
      <stop offset="100%" stop-color="#ffd1dc"/>
    </linearGradient>
  </defs>

  <!-- Document sheet with neon-red border (no gap) -->
  <path
    d="M 120 56 L 310 56 L 400 146 L 400 430 C 400 444 389 456 374 456 L 120 456 C 105 456 94 444 94 430 L 94 82 C 94 67 105 56 120 56 Z"
    fill="url(#paper)"
    stroke="#ff1e56"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Folded corner shadow -->
  <path d="M 310 56 L 310 132 C 310 140 316 146 324 146 L 400 146 Z" fill="#000000" opacity="0.12" transform="translate(-2, 3)"/>
  <!-- Folded corner flap -->
  <path d="M 310 56 L 310 132 C 310 140 316 146 324 146 L 400 146 Z" fill="url(#fold)"/>
  <!-- Fold edge line -->
  <path d="M 310 56 L 400 146" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Document decorative content lines -->
  <line x1="140" y1="178" x2="230" y2="178" stroke="#ff1e56" stroke-width="11" stroke-linecap="round" opacity="0.9"/>
  <line x1="140" y1="208" x2="200" y2="208" stroke="#94a3b8" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <line x1="140" y1="358" x2="350" y2="358" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <line x1="140" y1="386" x2="240" y2="386" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>

  <!-- Speed aura shadow behind lightning -->
  <path d="M 300 80 L 186 268 L 268 268 L 178 440 L 332 232 L 252 232 Z" fill="#ff1e56" opacity="0.25" transform="scale(1.05) translate(-12, -10)"/>

  <!-- The Neon Lightning Bolt (Main body) -->
  <path d="M 300 80 L 186 268 L 268 268 L 178 440 L 332 232 L 252 232 Z" fill="url(#lightning)"/>

  <!-- Inner white-hot neon electric core -->
  <path d="M 294 106 L 204 258 L 260 258 L 198 392 L 310 242 L 256 242 Z" fill="url(#lightning-core)" opacity="0.95"/>

  <!-- Top highlight on lightning edge -->
  <path d="M 300 80 L 252 232 L 332 232 Z" fill="#ffffff" opacity="0.3"/>

  <!-- LitheXPDF badge at bottom-right -->
  <g transform="translate(224, 398)">
    <rect width="152" height="38" rx="7" fill="#ff1e56"/>
    <text
      x="76" y="26"
      font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="15"
      fill="#ffffff"
      text-anchor="middle"
      letter-spacing="1.5"
    >LitheXPDF</text>
  </g>
</svg>
