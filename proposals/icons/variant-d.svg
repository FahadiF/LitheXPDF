<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Variant D: Compact design - neon red outlined document with a smaller lightning
    bolt positioned in the upper portion, and "LitheXPDF" written large and bold
    across the lower half of the document. Transparent background.
  -->

  <!-- Document body: white fill, neon-red thick stroke -->
  <path
    d="M100 24h210l102 102v362H100z"
    fill="#fff"
    stroke="#ff1e56"
    stroke-linejoin="round"
    stroke-width="16"
  />

  <!-- Folded corner flap -->
  <path
    d="M310 24v102h102"
    fill="none"
    stroke="#ff1e56"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="16"
  />

  <!-- Smaller lightning bolt, upper area -->
  <path
    d="m310 100-90 130h65l-44 108 130-158h-70l50-80z"
    fill="#ff1e56"
  />

  <!-- Horizontal rule separator -->
  <line x1="140" y1="370" x2="372" y2="370" stroke="#ff1e56" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- "LitheX" on one line -->
  <text
    x="256" y="420"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="52"
    fill="#ff1e56"
    text-anchor="middle"
    letter-spacing="1"
  >LitheX</text>

  <!-- "PDF" below, slightly smaller -->
  <text
    x="256" y="466"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="40"
    fill="#ff1e56"
    text-anchor="middle"
    letter-spacing="6"
  >PDF</text>
</svg>
