<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Variant B: Neon-red outlined document with lightning bolt.
    Transparent background. "LitheXPDF" text inside the document body
    (not in a badge, but directly on the paper below the bolt).
    Bolder lightning with a white inner highlight for depth.
  -->

  <!-- Document body: white fill, neon-red thick stroke -->
  <path
    d="M100 36h200l106 106v334H100z"
    fill="#fff"
    stroke="#ff1e56"
    stroke-linejoin="round"
    stroke-width="18"
  />

  <!-- Folded corner flap -->
  <path
    d="M300 36v106h106"
    fill="none"
    stroke="#ff1e56"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="18"
  />

  <!-- Lightning bolt - solid neon red, slightly larger -->
  <path
    d="m305 130-125 175h88l-60 150 170-215h-95l68-110z"
    fill="#ff1e56"
  />

  <!-- Lightning inner core - white highlight for depth -->
  <path
    d="m295 158-100 140h60l-42 105 120-152h-65l52-93z"
    fill="#ffffff"
    opacity="0.5"
  />

  <!-- "LitheXPDF" text directly on the document -->
  <text
    x="256" y="450"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="42"
    fill="#ff1e56"
    text-anchor="middle"
    letter-spacing="1"
  >LitheXPDF</text>
</svg>
