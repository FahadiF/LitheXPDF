name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 checks and MSI candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --target x86_64-pc-windows-msvc
          cargo test --workspace --target x86_64-pc-windows-msvc
      - name: Build x64 MSI candidate
        run: pnpm release:msi
      - name: Record MSI SHA-256
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'The MSI build produced no installer.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi.FullName).Hash.ToLowerInvariant()
          "$hash  $($msi.Name)" | Set-Content -LiteralPath "$($msi.FullName).sha256"
          "MSI: $($msi.Name)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Upload unsigned x64 MSI candidate
        uses: actions/upload-artifact@v4
        with:
          name: lithexpdf-windows-x64-msi
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sha256
          if-no-files-found: error
          retention-days: 14

# This workflow intentionally does not sign, publish, or release artifacts.
# Add the i686 job only after a verified 32-bit PDFium DLL, its notices, target
# configuration, and a suitable Windows test environment are available.
