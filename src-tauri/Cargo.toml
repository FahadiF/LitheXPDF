[package]
name = "lithexpdf-host"
version = "0.1.0"
description = "LitheXPDF Tauri desktop host"
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[lib]
name = "lithexpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = { version = "2" }
