[package]
name = "lithexpdf-host"
version = "0.1.0"
description = "LitheXPDF Tauri desktop host"
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[lib]
name = "lithexpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pdfium-protocol = { path = "../crates/pdfium-protocol" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = { version = "2" }
tokio = { version = "1", features = ["sync", "time"] }
